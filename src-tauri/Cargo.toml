[package]
name = "seed-studio"
version = "0.2.0"
description = "An open-source macOS studio for BytePlus image and video generation"
license = "MIT"
repository = "https://github.com/awsnasser/seed-studio"
edition = "2021"
default-run = "seed-studio"

[lib]
name = "seed_studio_lib"
path = "src/lib.rs"

[[bin]]
name = "seed-studio"
path = "src/main.rs"

[[bin]]
name = "devserver"
path = "src/bin/devserver.rs"
required-features = ["devserver"]

[features]
devserver = ["dep:tiny_http"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures-util = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pdf-extract = "0.7"
lopdf = "0.34"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "aac", "isomp4"] }
tiny_http = { version = "0.12", optional = true }

[dev-dependencies]
tiny_http = "0.12"

[profile.release]
opt-level = 2
strip = true
